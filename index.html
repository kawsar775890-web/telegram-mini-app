<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Hub BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        .header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 18px; color: #38bdf8; }
        .container { padding: 20px; flex-grow: 1; overflow-y: auto; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .balance { font-size: 32px; font-weight: bold; color: #4ade80; margin: 10px 0; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .btn-success { background: #16a34a; }
        .btn:active { opacity: 0.8; }
        .nav-bar { background: #1e293b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 14px; cursor: pointer; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Task Hub BD</h1>
    </div>

    <div class="container">
        <!-- Home Tab -->
        <div id="home" class="tab-content active">
            <div class="card">
                <h3>Welcome, <span id="user-name">User</span>!</h3>
                <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">ID: <span id="user-id">000000</span></p>
                <div class="balance">৳<span id="user-balance">0.00</span></div>
                <p>Current Balance</p>
            </div>
            <div class="card">
                <h4>Account Activation</h4>
                <p style="font-size: 13px; color: #94a3b8; margin: 8px 0;">Send ৳30 to BKash/Nagad: <b>01602725947</b></p>
                <button class="btn btn-success" onclick="alert('Activation Request Sent!')">Activate Account</button>
            </div>
        </div>

        <!-- Earn Tab -->
        <div id="earn" class="tab-content">
            <div class="card">
                <h3>Watch & Earn</h3>
                <p style="font-size: 13px; color: #94a3b8; margin: 10px 0;">Watch YouTube video to get ৳20 bonus!</p>
                <button class="btn" onclick="window.open('https://youtube.com/shorts/K_X-zzBPjIM', '_blank')">Watch Video (৳20)</button>
            </div>
        </div>

        <!-- Referral Tab -->
        <div id="ref" class="tab-content">
            <div class="card">
                <h3>Refer & Earn</h3>
                <p style="font-size: 13px; color: #94a3b8; margin: 10px 0;">Share your link with friends!</p>
                <input type="text" id="ref-link" readonly value="Loading...">
                <button class="btn" onclick="copyRefLink()">Copy Link</button>
            </div>
        </div>

        <!-- Profile Tab -->
        <div id="profile" class="tab-content">
            <div class="card">
                <h3>Support & Help</h3>
                <p style="font-size: 13px; color: #94a3b8; margin: 10px 0;">Contact our support admin</p>
                <button class="btn" onclick="window.open('https://t.me/emone0011', '_blank')">Contact Admin</button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">Home</div>
        <div class="nav-item" onclick="switchTab('earn', this)">Earn</div>
        <div class="nav-item" onclick="switchTab('ref', this)">Refer</div>
        <div class="nav-item" onclick="switchTab('profile', this)">Profile</div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
        }

        let userData = {
            id: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 12345678,
            first_name: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : 'User'
        };

        document.getElementById('user-name').innerText = userData.first_name;
        document.getElementById('user-id').innerText = userData.id;
        document.getElementById('ref-link').value = `https://t.me/HubBD_Bot?start=${userData.id}`;

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(element) element.classList.add('active');
        }

        function copyRefLink() {
            const input = document.getElementById('ref-link');
            input.select();
            document.execCommand('copy');
            alert('Referral link copied!');
        }
    </script>
</body>
</html>
